<!DOCTYPE html>
<html lang="en">
 <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title> Friends - Evolvia</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
        <script src="https://cdn.tailwindcss.com"></script>
        <script>
            tailwind.config = {
                theme: {
                    extend: {
                         colors: {
                            bg: "#EDF3F0",
                            card: "#DCE7E1",
                            border: "#BFCFC6",
                            navbar: "#E5EDEA",

                            primarybutton: "#638874",
                            buttonHover: "#709187",

                            mainText: "#29383A",
                            secondaryText: "#84999A",


                            badge1: "#83AC91",
                            badge2: "#99BDAE",
                            badge3: "#849FA3",
                            badge4: "#41545A",
                    },
                         fontFamily: {
                            sans: ["Poppins", "sans-serif"],
                        },
                    },
                },
            };
            </script>
    </head>
    <body class="bg-bg text-mainText min-h-screen">

        <!--Top nav-->
         <nav class="grid grid-cols-3 items-center px-8 py-4 border-b border-border">
                <span class="font-bold text-lg">&lt;/&gt; Evolvia</span>
                <div class="hidden md:flex justify-center gap-6 text-sm text-secondaryText">
               <a href="dashboard.html" class="text-secondaryText hover:bg-card hover:text-mainText px-4 py-2 rounded-full transition-all duration-200 hover:-translate-y-0.5 active:scale-95">Dashboard</a>
                    <a href="practice.html" class="text-secondaryText hover:bg-card hover:text-mainText px-4 py-2 rounded-full transition-all duration-200 hover:-translate-y-0.5 active:scale-95">Practice</a>
                    <a href="friends.html" class="bg-primarybutton text-mainText text-sm font-medium px-4 py-2 rounded-full">Friends</a>
                    <a href="profile.html" class="text-secondaryText hover:bg-card hover:text-mainText px-4 py-2 rounded-full transition-all duration-200 hover:-translate-y-0.5 active:scale-95">Profile</a>
                    <a href="badges.html" class="text-secondaryText hover:bg-card hover:text-mainText px-4 py-2 rounded-full transition-all duration-200 hover:-translate-y-0.5 active:scale-95">Badges</a>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <a href="about.html" class="text-sm text-secondaryText hover:bg-card hover:text-mainText px-4 py-2 rounded-full transition-all duration-200 hover:-translate-y-0.5 active:scale-95">About</a>
                <a href="loginpage.html" class="text-sm text-secondaryText hover:text-mainText">Login</a>
                <button class="bg-primarybutton hover:bg-buttonHover text-white text-sm font-medium px-4 py-2 rounded-full">
                    Sign Up
                </button> 
            </div>
        </nav>
        <main class="max-w-4xl mx-auto px-6 py-10">

            <div classes="flex items-center justify-between mb-6">
                <h1 class="text-2xl font-bold">My Friends</h1>
                <button class="bg-primarybutton hover:bg-buttonHover text-white text-sm font-medium px-4 py-2 rounded-lg">
                    Find Friends
                </button>
            </div>

            <input
                type="text"
                placeholder="search friends..."
                class="w-full bg-card border border-border rounded-lg px-4 py-2 text-sm mb-8 placeholder-gray-500 focus:outline-none focus;border-purple-500"
            />

            <div class="space-y-3">

                <!--Friend row-->
           <div class="flex items-center justify-between bg-card border border-border rounded-xl px-5 py-4">
                <div class="flex items-center gap-4">
                    <div class="=relative">
                        <div class="w-12 h-12 rounded-full bg-badge2 flex items-center justify-center font-bold">P</div>
                        <span class="absolute bottom-0 right-0 w-3 h-3 rounded-full bg-green-400 border-2 border-card"></span>
                    </div>
                    <div>
                        <p class="font-semibold text-sm">Piggy</p>
                        <p class="text-xs text-secondaryText">Level 6 · 767 XP</p>
                    </div>
                </div>
                <button class="text-sm text-primarybutton hover:text-buttonHover font-medium">Message</button>
            </div>

            <div class="flex items-center justify-between bg-card border border-border rounded-xl px-5 py-4">
                <div class="flex items-center gap-4">
                    <div class="=relative">
                        <div class="w-12 h-12 rounded-full bg-badge1 flex items-center justify-center font-bold">A</div>
                        <span class="absolute bottom-0 right-0 w-3 h-3 rounded-full bg-green-400 border-2 border-card"></span>
                    </div>
                    <div>
                        <p class="font-semibold text-sm">Amit</p>
                        <p class="text-xs text-secondaryText">Level 5 · 860 XP</p>
                    </div>
                </div>
                <button class="text-sm text-primarybutton hover:text-buttonHover font-medium">Message</button>
            </div>

            <div class="flex items-center justify-between bg-card border border-border rounded-xl px-5 py-4">
            <div class="flex items-center gap-4">
                <div class="relative">
                    <div class="w-12 h-12 rounded-full bg-badge3 flex items-center justify-center font-bold">B</div>
                    <span class="absolute bottom-0 right-0 w-3 h-3 rounded-full bg-gray-500 border-2 border-card"></span>
                </div>
                <div>
                    <p class="font-semibold text-sm">Bhavishya</p>
                    <p class="text-xs text-secondaryText">Level 2 · 121 XP</p>
                </div>
            </div>
            <div class="text-right">
                <p class="text-xs text-secondaryText-mb-1">Offline</p>
                <button class="text-sm text-primarybutton hover:text-buttonHover font-medium">Message</button>
            </div>
        </div>
        
        <div class="flex items-center justify-between bg-card border border-border rounded-xl px-5 py-4">
            <div class="flex items-center gap-4">
                <div class="relative">
                    <div class="w-12 h-12 rounded-full bg-badge4 flex items-center justify-center font-bold">A</div>
                    <span class="absolute bottom-0 right-0 w-3 h-3 rounded-full bg-green-400 border-2 border-card"></span>
                </div>
                <div>
                    <p class="font-semibold text-sm">Aanand</p>
                    <p class="text-xs text-secondaryText">Level 8 · 1200 XP</p>
                </div>
                </div>
                <button class="text-sm text-primarybutton hover:text-buttonHover font-medium">Messages</button>
            </div>
        
        </div>
    
    </main>
    <img src="doro.webp" class="fixed bottom-4 right-4 w-16 z-50 select-none pointer-events-none" alt="mascot" />

</body>
</html>
